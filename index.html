<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Piramid Makanan Pro – Edisi Cikgu</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --green:   #2ecc71;
            --green-d: #27ae60;
            --orange:  #f39c12;
            --red:     #e74c3c;
            --blue:    #3498db;
            --bg:      #f0f4f8;
            --card:    #ffffff;
            --text:    #2c3e50;
            --shadow:  0 8px 30px rgba(0,0,0,0.12);
            --theme-color: #3498db; /* Default */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 15px;
            transition: background 0.5s ease;
        }

        /* ── TOP BAR ───────────────────────────────── */
        header { text-align: center; margin-bottom: 25px; }
        header h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 2.2rem;
            color: var(--text);
            text-shadow: 2px 2px 0px #fff;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: white;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            text-align: center;
            min-width: 100px;
        }

        .stat-box .label { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: #95a5a6; }
        .stat-box .value { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800; color: var(--theme-color); }
        
        #lives-display { color: var(--red); }
        #timer-display.low { color: var(--red); animation: blink 0.5s infinite; }

        @keyframes blink { 50% { opacity: 0; } }

        /* ── PROGRESS ─────────────────────────────── */
        .progress-container {
            max-width: 600px;
            margin: 0 auto 25px;
            height: 12px;
            background: #dcdde1;
            border-radius: 10px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--green), var(--theme-color));
            transition: width 0.4s ease;
        }

        /* ── GAME AREA ─────────────────────────────── */
        #game-wrap { max-width: 900px; margin: 0 auto; }
        
        .columns {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
        }

        .column-title {
            text-align: center;
            font-weight: 900;
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: #7f8c8d;
            letter-spacing: 1px;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: var(--shadow);
            border: 3px solid transparent;
            transition: all 0.2s;
            position: relative;
            font-size: 1rem;
            line-height: 1.5;
        }

        .card:hover:not(.matched) { transform: translateY(-5px); border-color: #bdc3c7; }
        .card.selected { border-color: var(--theme-color); background: #f0f7ff; transform: scale(1.02); }
        .card.matched { background: #f1f2f6; opacity: 0.7; cursor: default; border-color: var(--green); }
        .card.wrong { animation: shake 0.4s; border-color: var(--red); }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: var(--theme-color);
            color: white;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        #feedback {
            text-align: center;
            height: 30px;
            font-weight: 800;
            margin: 15px 0;
            font-size: 1.1rem;
        }

        /* ── SCREENS ───────────────────────────────── */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .modal {
            background: white;
            color: var(--text);
            padding: 40px;
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
        }

        .btn-main {
            background: var(--theme-color);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn-main:hover { transform: scale(1.05); }

        @media(max-width: 600px) {
            .columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>🍎 Piramid Makanan Malaysia</h1>
</header>

<div class="stats-container">
    <div class="stat-box">
        <div class="label">Mata</div>
        <div class="value" id="score-val">0</div>
    </div>
    <div class="stat-box">
        <div class="label">Masa</div>
        <div class="value" id="timer-display">02:00</div>
    </div>
    <div class="stat-box">
        <div class="label">Nyawa</div>
        <div class="value" id="lives-display">❤️❤️❤️</div>
    </div>
</div>

<div class="progress-container">
    <div id="progress-bar"></div>
</div>

<div id="game-wrap">
    <div class="columns">
        <div>
            <div class="column-title">💡 IDEA UTAMA</div>
            <div id="col-utama"></div>
        </div>
        <div>
            <div class="column-title">📌 IDEA SAMPINGAN</div>
            <div id="col-sampingan"></div>
        </div>
    </div>
    <div id="feedback"></div>
</div>

<div id="end-screen" class="overlay">
    <div class="modal">
        <h2 id="end-title" style="font-size: 2.5rem; font-family: 'Baloo 2';">TAHNIAH! 🏆</h2>
        <p id="end-msg" style="margin: 15px 0; font-size: 1.1rem;"></p>
        <div style="font-size: 3rem; font-weight: 900; color: var(--green-d);" id="final-score">0</div>
        <button class="btn-main" onclick="location.reload()">Main Semula 🔄</button>
    </div>
</div>

<script>
// DATA PERMAINAN
const paragraphs = [
    {
        title: "Asas Pemakanan",
        color: "#3498db",
        utama: "Piramid Makanan Malaysia merupakan panduan asas yang sangat berguna untuk kita mengamalkan pemakanan yang sihat.",
        sampingan: [
            { text: "Piramid ini menunjukkan dengan jelas berapa banyak setiap kumpulan makanan perlu dimakan setiap hari.", correct: true },
            { text: "Selain menjaga pemakanan, kita juga disarankan meminum enam hingga lapan gelas air kosong.", correct: true }
        ]
    },
    {
        title: "Sayur & Buah",
        color: "#27ae60",
        utama: "Kumpulan sayur-sayuran dan buah-buahan adalah asas diet sihat yang perlu diambil dengan banyak.",
        sampingan: [
            { text: "Kita disyorkan untuk mengambil dua hingga tiga sajian sayur dan dua sajian buah-buahan setiap hari.", correct: true },
            { text: "Contoh makanan segar dalam kumpulan ini ialah sayur bayam, lobak merah dan tembikai.", correct: true }
        ]
    },
    {
        title: "Karbohidrat",
        color: "#f1c40f",
        utama: "Sumber karbohidrat pula penting sebagai pembekal tenaga utama kepada tubuh badan kita.",
        sampingan: [
            { text: "Kumpulan makanan jenis ini perlu diambil pada kadar tiga hingga lima sajian dalam tempoh sehari.", correct: true },
            { text: "Antara makanan lazim ialah nasi putih, roti, mi dan pelbagai jenis bijirin.", correct: true }
        ]
    },
    {
        title: "Protein",
        color: "#e67e22",
        utama: "Sumber protein amat diperlukan oleh manusia untuk membantu tumbesaran dan membina badan yang kuat.",
        sampingan: [
            { text: "Pengambilan protein memadai antara satu hingga dua sajian sahaja setiap hari.", correct: true },
            { text: "Ikan, ayam, daging, telur dan tauhu merupakan antara sumber protein yang sangat baik.", correct: true }
        ]
    }
];

// STATE
let currentRound = 0;
let score = 0;
let lives = 3;
let timeLeft = 120; // 2 minit
let timerInterval;
let selectedUtama = null;

// SOUND SYNTHESIS (Tiada fail luaran diperlukan)
const playSound = (type) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if(type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(); osc.stop(ctx.currentTime + 0.2);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
    }
};

function initGame() {
    startTimer();
    renderRound();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        const display = document.getElementById('timer-display');
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        if(timeLeft <= 10) display.classList.add('low');
        if(timeLeft <= 0) endGame(false, "Masa tamat!");
    }, 1000);
}

function renderRound() {
    const data = paragraphs[currentRound];
    document.body.style.setProperty('--theme-color', data.color);
    document.getElementById('feedback').textContent = "Pilih Idea Utama dahulu.";
    document.getElementById('feedback').style.color = "#7f8c8d";
    
    // Render Utama
    const colU = document.getElementById('col-utama');
    colU.innerHTML = '';
    const uCard = document.createElement('div');
    uCard.className = 'card';
    uCard.innerHTML = `<span class="badge">IDEA UTAMA: ${data.title}</span><br>${data.utama}`;
    uCard.onclick = () => {
        if(uCard.classList.contains('matched')) return;
        selectedUtama = uCard;
        document.querySelectorAll('#col-utama .card').forEach(c => c.classList.remove('selected'));
        uCard.classList.add('selected');
        document.getElementById('feedback').textContent = "Sekarang cari Idea Sampingan yang betul.";
    };
    colU.appendChild(uCard);

    // Render Sampingan (dengan pengacau)
    const colS = document.getElementById('col-sampingan');
    colS.innerHTML = '';
    
    // Ambil 2 yang betul + 2 pengacau dari perenggan lain
    let pool = [...data.sampingan];
    let distractors = paragraphs
        .filter((_, i) => i !== currentRound)
        .map(p => p.sampingan[0])
        .sort(() => 0.5 - Math.random())
        .slice(0, 2)
        .map(s => ({ ...s, correct: false }));
    
    pool = [...pool, ...distractors].sort(() => 0.5 - Math.random());

    pool.forEach(item => {
        const sCard = document.createElement('div');
        sCard.className = 'card';
        sCard.textContent = item.text;
        sCard.onclick = () => checkMatch(item, sCard);
        colS.appendChild(sCard);
    });

    updateProgress();
}

function checkMatch(item, element) {
    if(!selectedUtama) {
        document.getElementById('feedback').textContent = "❌ Pilih Idea Utama di kiri dahulu!";
        return;
    }
    if(element.classList.contains('matched')) return;

    if(item.correct) {
        playSound('correct');
        score += 20;
        document.getElementById('score-val').textContent = score;
        element.classList.add('matched');
        element.innerHTML += " ✅";
        document.getElementById('feedback').textContent = "✨ Bijak! Teruskan.";
        document.getElementById('feedback').style.color = "var(--green-d)";

        // Cek jika perenggan selesai
        const correctOnScreen = document.querySelectorAll('#col-sampingan .card.matched').length;
        if(correctOnScreen === 2) {
            selectedUtama.classList.add('matched');
            selectedUtama.classList.remove('selected');
            selectedUtama.innerHTML += " ⭐";
            setTimeout(nextRound, 1000);
        }
    } else {
        playSound('wrong');
        lives--;
        updateLives();
        element.classList.add('wrong');
        document.getElementById('feedback').textContent = "Oops! Itu Idea Sampingan bagi perenggan lain.";
        document.getElementById('feedback').style.color = "var(--red)";
        setTimeout(() => element.classList.remove('wrong'), 500);
        
        if(lives <= 0) endGame(false, "Nyawa anda telah habis!");
    }
}

function updateLives() {
    document.getElementById('lives-display').textContent = "❤️".repeat(lives) + "🖤".repeat(3-lives);
}

function updateProgress() {
    const pct = (currentRound / paragraphs.length) * 100;
    document.getElementById('progress-bar').style.width = pct + "%";
}

function nextRound() {
    currentRound++;
    if(currentRound < paragraphs.length) {
        renderRound();
    } else {
        endGame(true, "Luar biasa! Anda pakar Piramid Makanan!");
    }
}

function endGame(win, msg) {
    clearInterval(timerInterval);
    const screen = document.getElementById('end-screen');
    screen.style.display = 'flex';
    document.getElementById('end-title').textContent = win ? "TAHNIAH! 🏆" : "CUBA LAGI! 🏁";
    document.getElementById('end-msg').textContent = msg;
    document.getElementById('final-score').textContent = score + " MATA";
    
    if(win) {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }
}

initGame();
</script>

</body>
</html>
